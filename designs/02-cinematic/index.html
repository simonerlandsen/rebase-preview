<title>Rebase – passord</title>
<style>
  :root { --ink: #261440; --bg: #0d0618; --blue: #0058ff; --orange: #f05032; --text: #f3f0f8; --muted: #a79fb6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #2a1650 0%, var(--bg) 60%);
    color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form { width: min(360px, 100%); text-align: center; }
  svg { width: 72px; height: 72px; margin-bottom: 24px; }
  .a1 { animation: swap 2.4s cubic-bezier(.7,0,.3,1) infinite; }
  .a2 { animation: swap 2.4s cubic-bezier(.7,0,.3,1) infinite reverse; }
  @keyframes swap { 0%, 30% { transform: translateY(0); } 50%, 80% { transform: translateY(var(--d)); } 100% { transform: translateY(0); } }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  p { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .field { display: flex; gap: 8px; }
  input[type=password] {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid #3a2a55;
    background: #160c28; color: var(--text); font: inherit; outline: none; transition: border-color .2s;
  }
  input[type=password]:focus { border-color: var(--blue); }
  button {
    padding: 12px 18px; border: 0; border-radius: 10px; background: var(--blue); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid #00c1ff; outline-offset: 2px; }
  label.remember { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .error { color: #ff8a73; min-height: 20px; margin-top: 12px; font-size: 14px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .a1, .a2, .shake { animation: none; } }
</style>

  var KEY = 'rebase-pw';
  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var error = document.getElementById('error');

  function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  async function decrypt(password) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  function store(storage, value) { try { value ? storage.setItem(KEY, value) : storage.removeItem(KEY); } catch (e) {} }
  function load(storage) { try { return storage.getItem(KEY); } catch (e) { return null; } }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  var saved = load(localStorage) || load(sessionStorage);
  if (saved) {
    decrypt(saved).then(show, function () { store(localStorage, null); store(sessionStorage, null); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    error.textContent = '';
    var pw = input.value;
    decrypt(pw).then(function (html) {
      store(document.getElementById('remember').checked ? localStorage : sessionStorage, pw);
      show(html);
    }, function () {
      error.textContent = 'Feil passord.';
      form.classList.remove('shake');
      void form.offsetWidth;
      form.classList.add('shake');
      input.select();
